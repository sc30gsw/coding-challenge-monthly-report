services:
  postgres:
    image: postgres:17-alpine
    container_name: monthly-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monthly_report
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # テスト用データベースを初回起動時に作ります。TEST_DATABASE_URL の接続先です。
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monthly_report"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
