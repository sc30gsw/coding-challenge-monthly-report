overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  # elysia は exact-mirror を peerDependency `>= 0.0.9`（上限なし）で宣言しており、
  # pnpm の peer 自動解決が最新の 1.2.4 を引く。1.2.4 は SLSA provenance が無く
  # trustPolicy: no-downgrade に弾かれる（1.2.2 / 1.2.3 には provenance がある）。
  # elysia 本体の依存範囲 ^0.2.7 と一致し、かつ provenance のある 0.2.7 に固定する。
  exact-mirror: 0.2.7

trustPolicy: no-downgrade

# postcss/@babel が引く正規の deep transitive 依存。provenance 不足による誤検知のため、
# この特定バージョンのみ trust チェックから除外する（将来の別バージョンは引き続き検証対象）。
trustPolicyExclude:
  - "nanoid@3.3.14"
  - "semver@6.3.1"

onlyBuiltDependencies:
  - esbuild

# 公開直後の侵害された可能性のあるリリースを避けるため、公開から1日（1440分）経過したバージョンのみ許可する
minimumReleaseAge: 1440

allowBuilds:
  esbuild: set this to true or false
  msgpackr-extract: false
